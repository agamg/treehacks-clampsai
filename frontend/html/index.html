<link rel="stylesheet" href="./style.css" />

<div class="container">
    <div class="devices">
        <select name="video-devices" id="video-devices" class="video-devices">
            <option>Select video device</option>
        </select>
        <select name="audio-devices" id="audio-devices" class="audio-devices">
            <option>Select audio device</option>
        </select>
    </div>

    <button id="start-camera">Start Camera</button>

    <div class="webcam">
        <video id="video" autoplay muted></video>
    </div>

    <button id="start-record">Start Recording</button>
    <button id="stop-record">Stop Recording</button>

    <a target="_blank" class="recorded-preview"></a>
    <ul id="video-chunk-list"></ul>
    <div id="process-result"></div>
</div>

<script>
    const videoDevicesSelect = document.querySelector("#video-devices");
    const audioDevicesSelect = document.querySelector("#audio-devices");
    const cameraButton = document.querySelector("#start-camera");
    const webcam = document.querySelector(".webcam");
    const video = document.querySelector("#video");
    const startButton = document.querySelector("#start-record");
    const stopButton = document.querySelector("#stop-record");
    const recordedPreview = document.querySelector(".recorded-preview");

    async function init() {
        const cameraPermission = await navigator.permissions.query({ name: "camera" });
        const microphonePermission = await navigator.permissions.query({ name: "microphone" });

        if (cameraPermission.state === "prompt" || microphonePermission.state === "prompt") {
            await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: true
            });
        }

        await getDevices();
    }

    async function getDevices() {
        const mediaDevices = await navigator.mediaDevices.enumerateDevices();

        console.log(mediaDevices)

        for (const device of mediaDevices) {
            const optionElem = document.createElement('option');
            optionElem.value = device.deviceId;
            optionElem.innerText = device.label;

            if (device.kind === 'audioinput') {
                audioDevicesSelect.appendChild(optionElem);
            }

            if (device.kind === 'videoinput') {
                videoDevicesSelect.appendChild(optionElem);
            }
        }
    }

    let cameraStream = null;
    let mediaRecorder = null;
    let blobsRecorded = [];
    let isRecording = false;
    let videoCounter = 0;

    async function uploadVideo(blob) {
        const fileName = `${videoCounter}.webm`;
        videoCounter++;
        const formData = new FormData();
        formData.append('video', blob, fileName);

        try {
            console.log('Uploading video...')
            const response = await fetch('http://localhost:5002/save-video', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const result = await response.json();
                console.log('Video saved successfully:', result);
            } else {
                console.error('Failed to save video:', response.statusText);
            }
        } catch (error) {
            console.error('Error uploading video:', error);
        }
    }

    cameraButton.addEventListener('click', async () => {
        const videoDeviceId = videoDevicesSelect.options[videoDevicesSelect.selectedIndex].value;
        const audioDeviceId = audioDevicesSelect.options[audioDevicesSelect.selectedIndex].value;

        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: {
                    deviceId: videoDeviceId
                },
                audio: {
                    deviceId: audioDeviceId
                }
            })
            video.srcObject = cameraStream;
        } catch (e) {
            console.log(e)
        }

    })

    startButton.addEventListener('click', () => {
        isRecording = true;
        webcam.classList.add('recording');
        const recordLoop = async () => {
            while (isRecording) {
                mediaRecorder = new MediaRecorder(cameraStream, { mimeType: 'video/webm; codecs=vp8' });
                mediaRecorder.start();
                await new Promise(resolve => setTimeout(resolve, 5000)); // Wait for 3 seconds
                mediaRecorder.stop();
                mediaRecorder.addEventListener('dataavailable', (e) => {
                    if (e.data && e.data.size > 0) {
                        console.log(e.data);
                        blobsRecorded.push(e.data);

                        const rawBlob = e.data

                        console.log(rawBlob)

                        const blob = new Blob([e.data], { type: 'video/webm' });

                        uploadVideo(blob);


                        const url = URL.createObjectURL(blob);
                        const listItem = document.createElement('li');
                        const link = document.createElement('a');
                        link.href = url;
                        link.innerText = `Chunk ${Date.now()}`;
                        link.target = '_blank';
                        listItem.appendChild(link);
                        document.getElementById('video-chunk-list').appendChild(listItem);
                    }
                })
            }
        };
        recordLoop();
    })

    stopButton.addEventListener('click', () => {
        isRecording = false;
        mediaRecorder.stop();
        const objectURL = URL.createObjectURL(
            new Blob(blobsRecorded, {
                type: 'video/webm'
            })
        );
        console.log(objectURL);
        recordedPreview.href = objectURL;
        recordedPreview.innerText = objectURL;
        webcam.classList.remove('recording');
        // Reset mediaRecorder and blobsRecorded after stopping
        mediaRecorder = null;
        // uploadVideo(new Blob(blobsRecorded, { type: 'video/webm' }));
        blobsRecorded = [];
    })

    init()
</script>
